<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Card Foundation</title>
  
  <!-- Foundation CSS (apenas para o exemplo funcionar visualmente) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css" crossorigin="anonymous">
  
  <!-- Algumas classes utilitárias que usamos no app.css -->
  <style>
    .shadow-sm { box-shadow: 0 .125rem .25rem rgba(0,0,0,.075) !important; }
    .rounded-4 { border-radius: 1rem !important; }
    .w-100 { width: 100% !important; }
    .d-flex { display: flex !important; }
    .mb-2 { margin-bottom: 0.5rem !important; }
    .mb-3 { margin-bottom: 1rem !important; }
    .text-muted { color: #6c757d !important; }
    .text-dark { color: #212529 !important; }
    .fw-bold { font-weight: 700 !important; }
  </style>
</head>
<body style="background-color: #f8f9fa; padding: 3rem;">

  <!-- O grid-container e grid-x servem para mostrar como o card se comporta na malha do Foundation -->
  <div class="grid-container">
    <div class="grid-x grid-margin-x grid-margin-y">
      
      <!-- INÍCIO DO CARD -->
      <!-- 
        Classes Foundation aplicadas:
        - cell: Define que este elemento é uma coluna do grid-x.
        - small-12: Em telas de celular (mobile), o card ocupa as 12 colunas (100% de largura).
        - medium-6: Em tablets, o card ocupa 6 colunas (50% de largura, cabem 2 por linha).
        - large-4: Em desktops, o card ocupa 4 colunas (33% de largura, cabem 3 por linha).
        - d-flex: Utilitário para flexbox, garante que o card interno preencha a altura inteira caso os vizinhos sejam maiores.
      -->
      <div class="cell small-12 medium-6 large-4 d-flex">
        
        <!-- 
          Classes Foundation aplicadas:
          - callout: É o equivalente ao "card" do Bootstrap. Adiciona padding, fundo, e uma borda padrão.
          - w-100: Garante que o callout preencha toda a largura da 'cell'.
          (Os paddings e bordas foram removidos via style inline para um visual mais customizado)
        -->
        <div class="callout shadow-sm rounded-4 w-100" style="padding:0; overflow:hidden; border:none; cursor:pointer;">
          
          <!-- Imagem do Drink -->
          <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80" alt="Exemplo de Drink" style="height: 250px; width:100%; object-fit: cover;">
          
          <!-- Corpo do Card -->
          <div style="padding: 1.5rem;">
            <!-- Título da Bebida -->
            <h4 class="h5 fw-bold text-dark mb-2">Caipirinha Tradicional</h4>
            
            <!-- Descrição (Limitada a 2 linhas via CSS inline) -->
            <p class="text-muted small mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              A clássica caipirinha brasileira feita com cachaça prata de excelente qualidade, limão taiti amassado na hora e muito gelo.
            </p>
            
            <!-- Ingredientes (Tags) -->
            <div class="mb-3">
              <!-- 
                Classes Foundation aplicadas:
                - label: Cria uma "badge" ou etiqueta visual.
                - secondary: Aplica a cor cinza (estilo secundário) à etiqueta.
              -->
              <span class="label secondary">Cachaça</span>
              <span class="label secondary">Limão</span>
              <span class="label secondary">Açúcar</span>
              <span class="label secondary">Gelo</span>
            </div>
          </div>

        </div>

      </div>
      <!-- FIM DO CARD -->

    </div>
  </div>

</body>
</html>
